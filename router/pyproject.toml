[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-router"
version = "0.1.0"
description = "Shared-prefill edge LLM routing and head-only on-device federation"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.6,<3", "transformers>=5.18,<5.19", "safetensors>=0.8",
  "fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.10,<3", "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.11"]
signatures = ["cryptography>=44"]
strands = ["peft>=0.21,<0.22"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["edge_router*", "training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: explicitly enabled real-model tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
